## Regla de oro de este test
Si el visual falla pero las 3 capas funcionales pasan, el negocio sigue vendiendo. Si las 3 capas fallan pero el visual pasa, el negocio está roto aunque se vea bonito. Por eso es **opcional**: suma, no sustituye.
