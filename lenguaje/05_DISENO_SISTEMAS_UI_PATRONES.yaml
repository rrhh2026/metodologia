## 4. Patrón 2: Tabla de Datos con Filtros Reactivos & Paginación
```svelte
<script lang="ts">
  let { data = [], searchPlaceholder = 'Buscar...', columns, onRowClick } = $props();
  let query = $state('');
  let page = $state(1);
  let pageSize = $state(10);

  let filtered = $derived(
    data.filter((item: any) => 
      Object.values(item).some(val => 
        String(val).toLowerCase().includes(query.toLowerCase())
      )
    )
  );

  let pagedData = $derived(
    filtered.slice((page - 1) * pageSize, page * pageSize)
  );
  let totalPages = $derived(Math.ceil(filtered.length / pageSize) || 1);
</script>

<div class="datatable-wrapper">
  <!-- Barra de Filtros -->
  <div class="table-toolbar">
    <input 
      type="search" 
      bind:value={query} 
      placeholder={searchPlaceholder} 
      class="search-input" 
    />
    <span class="record-counter">{filtered.length} registros</span>
  </div>

  <!-- Tabla -->
  <table class="corporate-table">
    <thead>
      <tr>
        {#each columns as col}
          <th>{col.label}</th>
        {/each}
      </tr>
    </thead>
    <tbody>
      {#each pagedData as row}
        <tr onclick={() => onRowClick?.(row)}>
          {#each columns as col}
            <td>
              {#if col.render}
                {@render col.render(row[col.key], row)}
              {:else}
                {row[col.key]}
              {/if}
            </td>
          {/each}
        </tr>
      {/each}
    </tbody>
  </table>

  <!-- Paginación -->
  <div class="pagination-bar">
    <button disabled={page === 1} onclick={() => page--}>Anterior</button>
    <span>Página {page} de {totalPages}</span>
    <button disabled={page === totalPages} onclick={() => page++}>Siguiente</button>
  </div>
</div>
```

