# PATRONES DE DISEÑO UI & DESIGN SYSTEMS CORPORATIVOS

## 1. Filosofía de Diseño: "Zero-Popup" y Máxima Densidad de Información
En aplicaciones empresariales (ERP, CRM, RRHH, Portales de Operaciones), los modales/popups emergentes clásicos interrumpen el flujo mental del usuario y causan bugs de superposición en móviles.

### Reglas de Oro de UX Corporativo:
1. **Zero Popups Bloqueantes:** Usar **drawers laterales**, **paneles inline colapsables** o vistas dedicadas tipo expediente 360°.
2. **Tablas de Alta Densidad con Micro-KPIs:** Encabezados con contadores en vivo, barras de progreso y pills de estado con código de color semántico.
3. **Validación Reactiva Inline:** El usuario debe ver el feedback visual en tiempo real sin tener que presionar "Guardar" para descubrir un error.
4. **Accesibilidad Nativa (WCAG AA):** Soporte total de teclado (`Tab`, `Escape`, `Enter`), roles ARIA y contraste visual accesible.

