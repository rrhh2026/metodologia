## 3. Patrón 1: Wizard Paso a Paso Reactivo (4 Pasos sin Popups)
```svelte
<!-- Componente: WizardLayout.svelte -->
<script lang="ts">
  import { Check, ChevronRight } from 'lucide-svelte';
  
  let { currentStep = $bindable(1), steps, children } = $props();
</script>

<div class="wizard-container">
  <!-- Stepper Header -->
  <div class="wizard-steps-header">
    {#each steps as step, index}
      {@const stepNum = index + 1}
      {@const isDone = currentStep > stepNum}
      {@const isCurrent = currentStep === stepNum}
      
      <div class="step-indicator" class:done={isDone} class:current={isCurrent}>
        <div class="step-circle">
          {#if isDone}
            <Check size={14} />
          {:else}
            <span>{stepNum}</span>
          {/if}
        </div>
        <span class="step-label">{step.title}</span>
      </div>
      
      {#if index < steps.length - 1}
        <div class="step-divider" class:active={isDone}></div>
      {/if}
    {/each}
  </div>

  <!-- Contenido Dinámico del Paso -->
  <div class="wizard-content-card">
    {@render children()}
  </div>
</div>
```

