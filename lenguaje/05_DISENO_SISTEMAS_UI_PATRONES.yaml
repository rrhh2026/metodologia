## 5. Patrón 3: Expediente 360° con Pestañas & Acciones Inline
- **Cabecera Flotante:** Folio en badge grande, título del trámite, badge de estado y botones de exportación (PDF / Excel).
- **Cuerpo con Pestañas:**
  1. `Ficha Técnica`: Información detallada de la solicitud.
  2. `Firmas & Sellos`: Circuito jerárquico visual con estados `APROBADO`, `PENDIENTE` y `RECHAZADO`.
  3. `Nómina`: Tabla de colaboradores participantes.
  4. `Evaluación`: Calificación de eficacia con estrellas.
  5. `Bitácora & Notificaciones`: Auditoría de correos y avisos enviados.
- **Acciones Rápidas:** Panel inferior inline para Aprobar, Devolver, Rechazar o Dictaminar sin abrir popups.

