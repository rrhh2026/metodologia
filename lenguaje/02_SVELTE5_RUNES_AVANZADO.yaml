## 3. Snippets (`{#snippet}` y `{@render}`) — Composición sin Slots
```svelte
<!-- Definición de Snippet reutilizable dentro del mismo componente -->
{#snippet badgeEstado(estado: string)}
  <span class={`pill pill-${estado.toLowerCase()}`}>
    {estado}
  </span>
{/snippet}

<!-- Uso del snippet en la tabla -->
<table>
  {#each solicitudes as s}
    <tr>
      <td>{s.folio}</td>
      <td>{@render badgeEstado(s.estado)}</td>
    </tr>
  {/each}
</table>
```

