## 4. Estado Global Fuera de Componentes (`.svelte.ts`)
```ts
// src/lib/stores/auth.svelte.ts
export class AuthStore {
  user = $state<User | null>(null);
  token = $state<string | null>(null);
  isAuthenticated = $derived(!!this.user);

  login(userData: User, tokenStr: string) {
    this.user = userData;
    this.token = tokenStr;
    localStorage.setItem('auth_session', JSON.stringify({ userData, tokenStr }));
  }

  logout() {
    this.user = null;
    this.token = null;
    localStorage.removeItem('auth_session');
  }
}

export const authState = new AuthStore();
```
