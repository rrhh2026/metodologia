## 4. Validación Declarativa con Zod OpenAPI (`@hono/zod-validator`)
```ts
import { z } from 'zod';
import { zValidator } from '@hono/zod-validator';

const SolicitudSchema = z.object({
  carnetSolicitante: z.string().min(4).max(20),
  nombreCapacitacion: z.string().min(5).max(200),
  categoria: z.enum(['TECNICA', 'BLANDAS', 'SEGURIDAD', 'NORMATIVA']),
  costoEstimado: z.number().positive().optional(),
  duracionHoras: z.number().int().min(1).max(300)
});

app.post('/api/solicitudes', zValidator('json', SolicitudSchema, (result, c) => {
  if (!result.success) {
    return c.json({ success: false, errors: result.error.flatten() }, 400);
  }
}), async (c) => {
  const data = c.req.valid('json'); // Infiere tipo exacto de Zod
  const created = await db.insert(solicitudes).values(data).returning();
  return c.json({ success: true, data: created[0] }, 201);
});
```

