## 3. Middleware de Observabilidad No Bloqueante (Metodología 04 + 05)
```ts
import type { MiddlewareHandler } from 'hono';

export const observabilityLogger: MiddlewareHandler<AppEnv> = async (c, next) => {
  const start = Date.now();
  c.set('startTime', start);
  const method = c.req.method;
  const url = c.req.url;
  const path = c.req.path;

  // Clonado de stream seguro para captura de payload sin agotar buffer
  let reqBody: any = null;
  const contentType = c.req.header('content-type') || '';
  if (['POST', 'PUT', 'PATCH'].includes(method) && contentType.includes('application/json')) {
    try {
      const cloned = c.req.raw.clone();
      const rawText = await cloned.text();
      if (rawText.trim()) reqBody = JSON.parse(rawText);
    } catch {}
  }

  let errorMessage: string | null = null;
  let errorStack: string | null = null;

  try {
    await next();
  } catch (err: any) {
    errorMessage = err?.message || 'Error no controlado';
    errorStack = err?.stack || null;
    throw err;
  } finally {
    const durationMs = Date.now() - start;
    const statusCode = c.res ? c.res.status : (errorMessage ? 500 : 200);

    // Inserción asíncrona no bloqueante
    queueMicrotask(async () => {
      try {
        await sql`
          INSERT INTO api_request_logs (
            log_level, method, url, route_pattern, status_code, duration_ms,
            user_id, request_body, error_message, error_stack
          ) VALUES (
            ${statusCode >= 500 ? 'ERROR' : statusCode >= 400 ? 'WARN' : 'INFO'},
            ${method}, ${url}, ${c.req.routePath || path}, ${statusCode}, ${durationMs},
            ${c.get('user')?.carnet || null}, ${reqBody ? JSON.stringify(reqBody) : null},
            ${errorMessage}, ${errorStack}
          );
        `;
      } catch {}
    });
  }
};
```

