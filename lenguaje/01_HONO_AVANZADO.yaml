## 6. Server-Sent Events (SSE) y Notificaciones en Tiempo Real
```ts
import { streamSSE } from 'hono/streaming';

app.get('/api/firmas/notificaciones-en-vivo', async (c) => {
  return streamSSE(c, async (stream) => {
    while (true) {
      const nuevasFirmas = await obtenerFirmasPendientes();
      await stream.writeSSE({
        data: JSON.stringify(nuevasFirmas),
        event: 'firmas-update',
        id: String(Date.now())
      });
      await stream.sleep(3000);
    }
  });
});
```
