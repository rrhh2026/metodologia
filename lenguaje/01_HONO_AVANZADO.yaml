# HONO 4 — GUÍA DE ARQUITECTURA AVANZADA Y PRODUCCIÓN

## 1. Fundamentos & Ventajas Competitivas
- **Latencia Zero-Overhead:** Basado en RegExpRouter (el router más rápido de JavaScript).
- **Multi-Runtime:** Ejecuta idénticamente en Node.js 20+, Bun, Cloudflare Workers, Deno y AWS Lambda.
- **Tipado RPC End-to-End (`hc`):** Inferencia automática de tipos desde las rutas del servidor hacia el cliente frontend sin generar código ni compilar OpenAPI.
- **Memoria Mínima:** ~40-60 MB en producción (frente a 150-250 MB de NestJS/Express).

