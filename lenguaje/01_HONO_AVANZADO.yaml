## 2. Tipado Estricto de Contexto (`Hono<{ Variables, Bindings }>`)
```ts
import { Hono } from 'hono';

export type AppEnv = {
  Variables: {
    user: { carnet: string; email: string; role: string };
    requestId: string;
    startTime: number;
  };
  Bindings: {
    DATABASE_URL: string;
    JWT_SECRET: string;
  };
};

export const app = new Hono<AppEnv>();
```

