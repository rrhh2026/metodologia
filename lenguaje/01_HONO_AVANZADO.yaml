## 5. Streaming de Binarios (PDF y Excel) en `@hono/node-server`
```ts
// Retorno en streaming sin buffering de memoria masivo
app.get('/api/reporte/pdf', async (c) => {
  const pdfBuffer = await generarPdfStream();
  return new Response(pdfBuffer as any, {
    status: 200,
    headers: {
      'Content-Type': 'application/pdf',
      'Content-Disposition': 'inline; filename="reporte.pdf"',
      'Content-Length': pdfBuffer.length.toString()
    }
  });
});
```

