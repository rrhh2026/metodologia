# DRIZZLE ORM — GUÍA AVANZADA PARA POSTGRESQL

## 1. Principios de Diseño
- **SQL-Like First:** No inventa un lenguaje nuevo; escribe TypeScript que mapea 1:1 a SQL puro sin capas de abstracción pesadas.
- **Cero Runtime Overhead:** A diferencia de TypeORM/Prisma, Drizzle genera SQL estático rápido con tipos inferidos en tiempo de compilación.
- **Soporte Nativo de PostgreSQL:** JSONB, UUID, Arrays `text[]`, Generación de columnas e índices compuestos.

---

## 2. Esquema Relacional con `relations()`
```ts
import { pgTable, serial, varchar, text, numeric, integer, timestamp, uuid } from 'drizzle-orm/pg-core';
import { relations } from 'drizzle-orm';

export const solicitudes = pgTable('dnc_solicitudes', {
  id: serial('id').primaryKey(),
  folio: varchar('folio', { length: 30 }).unique().notNull(),
  nombreCapacitacion: varchar('nombre_capacitacion', { length: 200 }).notNull(),
  costoEstimado: numeric('costo_estimado', { precision: 12, scale: 2 }),
  estado: varchar('estado', { length: 30 }).default('BORRADOR').notNull(),
  createdAt: timestamp('created_at').defaultNow().notNull()
});

export const participantes = pgTable('dnc_participantes', {
  id: serial('id').primaryKey(),
  solicitudId: integer('solicitud_id').references(() => solicitudes.id, { onDelete: 'cascade' }).notNull(),
  carnet: varchar('carnet', { length: 20 }).notNull(),
  nombreCompleto: varchar('nombre_completo', { length: 200 }).notNull()
});

export const solicitudesRelations = relations(solicitudes, ({ many }) => ({
  participantes: many(participantes)
}));

export const participantesRelations = relations(participantes, ({ one }) => ({
  solicitud: one(solicitudes, {
    fields: [participantes.solicitudId],
    references: [solicitudes.id]
  })
}));
```

