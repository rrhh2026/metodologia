## 4. Transacciones ACID Atómicas con Rollback Automático
```ts
export async function crearSolicitudConParticipantes(data: NuevaSolicitud, listaParticipantes: Participante[]) {
  return await db.transaction(async (tx) => {
    // 1. Insertar Cabecera
    const [sol] = await tx.insert(solicitudes).values(data).returning();

    // 2. Insertar Detalle en Bloque
    if (listaParticipantes.length > 0) {
      await tx.insert(participantes).values(
        listaParticipantes.map(p => ({
          solicitudId: sol.id,
          carnet: p.carnet,
          nombreCompleto: p.nombreCompleto
        }))
      );
    }

    // 3. Crear Circuito de Firmas Automático
    await tx.insert(aprobaciones).values([
      { solicitudId: sol.id, orden: 1, rol: 'JEFE_INMEDIATO', estado: 'PENDIENTE' },
      { solicitudId: sol.id, orden: 2, rol: 'GERENTE_AREA', estado: 'PENDIENTE' }
    ]);

    return sol;
  });
}
```

