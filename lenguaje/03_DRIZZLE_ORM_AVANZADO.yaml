## 6. Operaciones Avanzadas en JSONB
```ts
import { sql } from 'drizzle-orm';

// Búsqueda en payloads estructurados dentro de PostgreSQL
const logs = await db.select()
  .from(apiRequestLogs)
  .where(sql`${apiRequestLogs.requestBody}->>'categoria' = 'TECNICA'`)
  .limit(50);
```
