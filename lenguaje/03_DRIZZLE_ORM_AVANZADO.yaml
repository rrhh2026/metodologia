## 3. Relational Queries con `with` (Zero JOIN Boilerplate)
```ts
// Cargar Solicitud con todos sus participantes y aprobaciones en una sola consulta estructurada
const expediente = await db.query.solicitudes.findFirst({
  where: (s, { eq }) => eq(s.id, solicitudId),
  with: {
    participantes: {
      columns: { carnet: true, nombreCompleto: true }
    }
  }
});
```

