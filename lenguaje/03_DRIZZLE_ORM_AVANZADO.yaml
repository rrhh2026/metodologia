## 5. Consultas Dinámicas con Filtros Condicionales
```ts
import { and, eq, ilike, gte, lte, SQL } from 'drizzle-orm';

export async function buscarSolicitudesFiltradas(filtros: {
  gerencia?: string;
  estado?: string;
  busqueda?: string;
  periodo?: number;
}) {
  const conditions: SQL[] = [];

  if (filtros.gerencia) conditions.push(eq(solicitudes.gerencia, filtros.gerencia));
  if (filtros.estado) conditions.push(eq(solicitudes.estado, filtros.estado));
  if (filtros.periodo) conditions.push(eq(solicitudes.periodoFiscal, filtros.periodo));
  if (filtros.busqueda) {
    conditions.push(ilike(solicitudes.nombreCapacitacion, `%${filtros.busqueda}%`));
  }

  return await db.select()
    .from(solicitudes)
    .where(conditions.length > 0 ? and(...conditions) : undefined)
    .orderBy(solicitudes.id);
}
```

