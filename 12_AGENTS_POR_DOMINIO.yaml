## Contenido — Regla para crear AGENTS.md por dominio

# 12 — AGENTS POR DOMINIO

> No todo proyecto necesita 5 agents. Especializá solo donde el skill genérico no acota contexto.

## 1. Prueba real 2026-08-27 — ¿Vale un agent especializado?

Tarea: `quick-sale para supermarket-cashier` (misma instrucción, dos prompts)

| Prompt | Tokens (o200k proxy) | Chars | Contexto cargado |
|---|---|---|---|
| Genérico `Sos agente general, arreglá pino2...` | 54 | 218 | 0 |
| Especializado `Sos Agent Frontend, lee solo route-guards.tsx + sales.routes.tsx` | 57 | 229 | 0 |
| **Genérico + ROUTER 2k** | **554** | 2000+ | `00_ROUTER.yaml` entero |
| **Especializado + frontend.md** | **290** | ~900 | solo su dominio |
| **Ahorro con contexto acotado** | **264 (48%)** | | |

> Sin contexto: empate (-6%). Con contexto real: **especializado ahorra 48%** porque no carga toda la metodología. Es la diferencia entre `principal <10k` vs `principal 150k` (regla 23).

## 2. Cobertura actual por dominio (skills existentes en /root/.config/opencode/skills)

| Dominio | Skills que ya cubren | Estado | ¿Necesita AGENT.md propio? |
|---|---|---|---|
| **frontend** `web/src/*` | `browser-testing` + `replica-espejo` | CUBIERTO | **NO** — ya acota. Usar skill, no agent nuevo |
| **backend** `backend/src/*` | `gst` + `sdd-apply/design/spec` | CUBIERTO | **NO** — `gst` ya delega con HANDOFF yaml |
| **testing** `e2e/*` | `browser-testing` + `gst-test` (3 capas) | CUBIERTO | **NO** |
| **design** `mockup → UI` | `cognitive-doc-design` + `replica-espejo` | PARCIAL | **SÍ si hacés 3+ pantallas/mes** — si no, usa skill |
| **analysis** `exploradora/auditoría` | `verificacion-honesta` + `sdd-explore` | PARCIAL | **SÍ** — `08_EXPLORADORA` necesita agent solo-lectura con contrato `[ATAJO]` |

## 3. Regla de decisión (cuándo crear .agents/<dominio>.md)

```
¿Tu tarea toca 1-3 archivos de UN dominio Y repetís >2 veces/mes?
  ├─ SÍ y skill existente no acota contexto → CREÁ .agents/<dominio>.md (ej: frontend.md con stack Svelte vs React)
  └─ NO o skill ya acota → NO crees. Usa `skill: browser-testing` o `skill: gst` directo
```

> pino2 hoy: **NO necesita 5 agents**. Mantener `/.agents/AGENTS.md` (seguridad) + usar skills. Si studio futuro hace 10+ pantallas/mes, crear `design.md` y `analysis.md` con contrato de 11_STACK (Svelte vs React, TOON vs YAML).

## 4. Si creás un agent, formato mínimo (ej: frontend.md)

```md
# Agent Frontend — React / Svelte
Stack: React 19 (2755 tok) default, Svelte 5 (2072 tok) para perf crítica
Lee solo: web/src/routes/route-guards.tsx + sales.routes.tsx
Formato: MD strict / TOON para tablas, YAML para HANDOFF, JSON min para output
Check: route-guards + 3 capas + topic catalog/products
```

> Archivado: `/opt/apps/pino2/.agents/frontend.md` creado como ejemplo y luego evaluado como **innecesario** para pino2 (skill cubre). No replicar sin medir 48% real.

## 5. Protocolo

```bash
[1] `engram search "<dominio>" --project <proyecto>` → si skill cubre, úsalo
[2] Si no cubre Y tarea se repite → crea `.agents/<dominio>.md` con stack de 11_STACK
[3] Valida: `python3 -c "import yaml; yaml.safe_load(open('.agents/<dominio>.md'))"` si usa frontmatter
[4] Mide: compara tokens con vs sin agent en próxima tarea real (como prueba arriba)
```

> Fuente: prueba 2026-08-27 o200k_base proxy de Muse Spark (deepseek-v4-flash). Para medida exacta usa tokenizer real del modelo.
